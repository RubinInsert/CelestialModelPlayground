<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Live Server</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@latest/build/three.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
          "three/examples/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/",
          "papaparse": "https://cdn.jsdelivr.net/npm/papaparse@latest/+esm"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
    <div id="controls" style="display: none">
      <div id="timestep-slider-container">
        <label for="timestep-slider">Time Step:</label>
        <input
          type="range"
          id="timestep-slider"
          min="0.01"
          max="10"
          step="0.01"
          value="5"
        />
        <span id="timestep-value">5</span>
      </div>
      <div id="proton-fields-toggle">
        <label>
          <input type="checkbox" id="enable-proton-fields" />
          Enable Proton Fields
        </label>
      </div>
      <div id="spin-state-toggle">
        <label>
          <input type="checkbox" id="enable-spin-state" />
          Enable Spin State Visualization
        </label>
      </div>
      <script>
        const slider = document.getElementById("timestep-slider");
        const valueDisplay = document.getElementById("timestep-value");
        slider.addEventListener("input", () => {
          valueDisplay.textContent = slider.value;
          // You can dispatch a custom event or call your update function here
        });
      </script>
    </div>
  </body>
</html>
